name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL alvo (padrão: https://www.saucedemo.com)'
        required: false
  schedule:
    # Execução diária (06:00 BRT) para detectar regressões no site alvo.
    - cron: '0 9 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ inputs.base_url || 'https://www.saucedemo.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package.json

      - name: Instalar dependências
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Type check
        run: npm run typecheck

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Executar testes
        run: npm test

      - name: Publicar relatório HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Publicar traces/vídeos de falhas
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
